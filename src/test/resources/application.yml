spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

api:
  tokens:
    - test-api-token

import:
  folder: /tmp/ranking-import-test
  schedule: "-"

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h
gg:
  jte:
    developmentMode: true

api:
  tokens:
    - test-api-token

grpc:
  server:
    port: 9095
    reflection-service-enabled: true
    health-service-enabled: true

import:
  folder: /tmp/ranking-import-test
  schedule: "-"

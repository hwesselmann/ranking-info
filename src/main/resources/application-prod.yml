spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ranking_info}
    username: ${DB_USER:ranking_info}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  thymeleaf:
    cache: true

server:
  tomcat:
    threads:
      max: 25
      min-spare: 5

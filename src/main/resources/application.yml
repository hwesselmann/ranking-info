spring:
  application:
    name: ranking-info
  profiles:
    active: dev
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h
  security:
    user:
      password: disabled
  threads:
    virtual:
      enabled: true

server:
  port: 8080

api:
  tokens: []
  rate-limit:
    # Caps how many per-key buckets the rate limiter holds. Callers are rate-limited before they
    # are authenticated, so this bounds memory against clients rotating their Authorization header.
    max-buckets: ${RATE_LIMIT_MAX_BUCKETS:10000}

grpc:
  server:
    port: 9090
    reflection-service-enabled: true
    health-service-enabled: true

import:
  folder: ${IMPORT_FOLDER:${user.home}/ranking-import}
  schedule: "${IMPORT_SCHEDULE:0 0 12 * * ?}"

imprint:
  domain: ${DOMAIN:localhost}
  name: ${IMPRINT_NAME:}
  street: ${IMPRINT_STREET:}
  zipcode: ${IMPRINT_ZIPCODE:}
  city: ${IMPRINT_CITY:}
  phone: ${IMPRINT_PHONE:}
  mail: ${IMPRINT_MAIL:}

gg:
  jte:
    developmentMode: true
    usePrecompiledTemplates: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    "[org.apache.catalina.webresources.AbstractFileResourceSet]": ERROR

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

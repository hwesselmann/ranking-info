<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vereinssuche | Ranking-Info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { brand: '#3e8ed0' } } } }</script>
    <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="w-full px-4 mx-auto">
    <h1 class="text-2xl font-bold mt-3 mb-3">Vereinssuche</h1>
    <form th:action="@{/clubs}" method="get" class="mb-3">
        <div class="flex flex-wrap items-center gap-2">
            <input type="search" name="club" class="border border-gray-300 rounded px-2 py-1 text-sm"
                   placeholder="Vereinsname" th:value="${params != null ? params['club'] : ''}">
            <button type="submit" name="commit" value="1"
                    class="bg-brand text-white px-3 py-1 text-sm rounded hover:opacity-90 cursor-pointer">suchen</button>
        </div>
    </form>
    <div th:if="${clubs != null and !#lists.isEmpty(clubs)}">
        <table class="w-full" role="table" aria-label="Vereinsliste">
            <thead>
            <tr class="bg-gray-100">
                <th scope="col" class="py-2 px-2 text-left">Verein</th>
                <th scope="col" class="py-2 px-2">Jugend</th>
                <th scope="col" class="py-2 px-2">Herren/Damen</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="club : ${clubs}" class="border-b border-gray-200 even:bg-gray-50">
                <td class="py-1 px-2">
                    <a th:href="@{/clubs/{name}(name=${club['name']})}" class="text-brand"
                       th:text="${club['name']}"></a>
                </td>
                <td class="py-1 px-2 text-center" th:text="${club['youth_count']}"></td>
                <td class="py-1 px-2 text-center" th:text="${club['adult_count']}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${clubs != null and #lists.isEmpty(clubs)}">Es wurden keine Vereine gefunden.</div>
</div>
</body>
</html>

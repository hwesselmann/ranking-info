<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${player != null ? player.firstname + ' ' + player.lastname + ' | Ranking-Info' : 'Spielerprofil'}">Spielerprofil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { brand: '#3e8ed0' } } } }</script>
    <link rel="stylesheet" th:href="@{/css/application.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartkick"></script>
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="w-full px-4 mx-auto">
    <h1 class="text-2xl font-bold text-left mb-3 mt-3">Spielerprofil</h1>
    <div th:if="${player != null}">

        <!-- Header: Name / Club -->
        <div class="grid grid-cols-2 mb-3">
            <div>
                <img th:src="@{/images/{nat}.svg(nat=${player.nationality.toLowerCase()})}"
                     width="35" th:alt="${player.nationality}" style="display:inline-block;">
                <span class="text-xl font-bold" th:text="${player.firstname + ' ' + player.lastname}"></span>
                <span class="text-sm text-gray-600" th:text="'DTB-ID ' + ${player.dtbId}"></span>
            </div>
            <div class="text-right">
                <a th:href="@{/clubs/{name}(name=${player.club})}" class="text-brand font-semibold"
                   th:text="${player.club}"></a>
                / <span class="italic" th:text="${player.federation}"></span>
            </div>
        </div>

        <!-- Section 1: Current position + 12-month positions chart -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <p class="text-sm font-semibold mt-2 mb-1">Aktuelle Position</p>
                <table class="w-full mt-1">
                    <tr class="bg-gray-800 text-white font-bold">
                        <th scope="col" class="text-center py-2 px-2">Altersklasse</th>
                        <th scope="col" class="py-2 px-2">Rang</th>
                        <th scope="col" class="py-2 px-2"></th>
                        <th scope="col" class="py-2 px-2">Punkte</th>
                        <th scope="col" class="py-2 px-2"></th>
                    </tr>
                    <tr th:each="r : ${currentRankings}"
                        th:classappend="${r['age_group'] == 'm00' or r['age_group'] == 'w00'} ? 'border-b border-gray-200 bg-blue-50' : 'border-b border-gray-200'">
                        <td class="text-center py-1 px-2"
                            th:text="${r['age_group'] == 'm00' or r['age_group'] == 'w00' ? 'Aktive' : r['age_group']}"></td>
                        <td class="py-1 px-2" th:text="${r['position']}"></td>
                        <td class="py-1 px-2">
                            <th:block th:with="pc=${r['position_change']}">
                                <span th:if="${pc == null or pc == '0'}">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true" class="ri-icon" style="display:inline-block;"><path d="M432 256c0 17.7-14.3 32-32 32L48 288c-17.7 0-32-14.3-32-32s14.3-32 32-32l352 0c17.7 0 32 14.3 32 32z"/></svg>
                                </span>
                                <span th:if="${pc != null and #strings.startsWith(pc, '+')}" class="ri-icon-green">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true" class="ri-icon" style="display:inline-block;"><path d="M182.6 137.4c-12.5-12.5-32.8-12.5-45.3 0l-128 128c-9.2 9.2-11.9 22.9-6.9 34.9s16.6 19.8 29.6 19.8l256 0c12.9 0 24.6-7.8 29.6-19.8s2.2-25.7-6.9-34.9l-128-128z"/></svg>
                                </span>
                                <span th:if="${pc != null and #strings.startsWith(pc, '-')}" class="ri-icon-red">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true" class="ri-icon" style="display:inline-block;"><path d="M137.4 374.6c12.5 12.5 32.8 12.5 45.3 0l128-128c9.2-9.2 11.9-22.9 6.9-34.9s-16.6-19.8-29.6-19.8L32 192c-12.9 0-24.6 7.8-29.6 19.8s-2.2 25.7 6.9 34.9l128 128z"/></svg>
                                </span>
                            </th:block>
                        </td>
                        <td class="py-1 px-2" th:text="${r['score']}"></td>
                        <td class="py-1 px-2">
                            <th:block th:with="sc=${r['score_change']}">
                                <span th:if="${sc != null and #strings.startsWith(sc, '+')}" class="ri-icon-green">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true" class="ri-icon" style="display:inline-block;"><path d="M182.6 137.4c-12.5-12.5-32.8-12.5-45.3 0l-128 128c-9.2 9.2-11.9 22.9-6.9 34.9s16.6 19.8 29.6 19.8l256 0c12.9 0 24.6-7.8 29.6-19.8s2.2-25.7-6.9-34.9l-128-128z"/></svg>
                                </span>
                                <span th:if="${sc != null and #strings.startsWith(sc, '-')}" class="ri-icon-red">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true" class="ri-icon" style="display:inline-block;"><path d="M137.4 374.6c12.5 12.5 32.8 12.5 45.3 0l128-128c9.2-9.2 11.9-22.9 6.9-34.9s-16.6-19.8-29.6-19.8L32 192c-12.9 0-24.6 7.8-29.6 19.8s-2.2 25.7 6.9 34.9l128 128z"/></svg>
                                </span>
                                <span th:if="${sc != null}" th:text="${#strings.replace(sc, '+', '')}"></span>
                            </th:block>
                        </td>
                    </tr>
                </table>
            </div>
            <div>
                <p class="text-sm font-semibold mt-2 mb-1">Verlauf Altersklasse (12 Monate)</p>
                <div class="mt-1">
                    <div id="chart-1" style="height: 300px; width: 100%; text-align: center; color: #999; line-height: 300px; font-size: 14px;">Loading...</div>
                    <script th:inline="javascript">
                        (function() {
                            var createChart = function() {
                                new Chartkick["LineChart"]("chart-1", /*[[${recent12mData}]]*/ [],
                                    {"curve": false, "legend": "bottom", "library": {"scales": {"y": {"reverse": true}}}});
                            };
                            if (typeof Chartkick !== "undefined") { createChart(); }
                            else { window.addEventListener("chartkick:load", createChart, true); }
                        })();
                    </script>
                </div>
            </div>
        </div>

        <!-- Section 2: 12-month score chart + Clubs + Available data -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div>
                <p class="text-sm font-semibold mt-2 mb-1">Verlauf Punkte (12 Monate)</p>
                <div class="mt-1">
                    <div id="chart-2" style="height: 300px; width: 100%; text-align: center; color: #999; line-height: 300px; font-size: 14px;">Loading...</div>
                    <script th:inline="javascript">
                        (function() {
                            var createChart = function() {
                                new Chartkick["ColumnChart"]("chart-2", /*[[${recent12mScoreData}]]*/ [],
                                    {"legend": false});
                            };
                            if (typeof Chartkick !== "undefined") { createChart(); }
                            else { window.addEventListener("chartkick:load", createChart, true); }
                        })();
                    </script>
                </div>
            </div>
            <div>
                <span class="text-sm font-semibold">Bisherige Vereine</span>
                <div class="mt-3">
                    <div class="bg-gray-800 text-white font-bold py-2 px-2">Verein</div>
                    <div th:each="c : ${player.clubs}" class="border-b border-gray-200 py-1 px-2"
                         th:text="${c.name + ' / ' + c.federation}"></div>
                </div>
                <p class="text-sm font-semibold mt-2 mb-1">Verfügbare Daten</p>
                <div class="mt-3">
                    <div class="grid grid-cols-12 bg-gray-800 text-white font-bold">
                        <div class="col-span-4 py-2 px-2">Jahr</div>
                        <div class="col-span-2 py-2 px-2">Q1</div>
                        <div class="col-span-2 py-2 px-2">Q2</div>
                        <div class="col-span-2 py-2 px-2">Q3</div>
                        <div class="col-span-2 py-2 px-2">Q4</div>
                    </div>
                    <div th:each="entry : ${availableData}" class="grid grid-cols-12 border-b border-gray-200">
                        <div class="col-span-4 py-1 px-2" th:text="${entry.key}"></div>
                        <th:block th:each="q : ${ {'Q1','Q2','Q3','Q4'} }">
                            <div class="col-span-2 py-1 px-2">
                                <span th:if="${entry.value.contains(q)}" class="ri-icon-green">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true" class="ri-icon" style="display:inline-block;"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM369 209L241 337c-9.4 9.4-24.6 9.4-33.9 0l-64-64c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L335 175c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z"/></svg>
                                </span>
                            </div>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 3: All-time charts -->
        <div class="mt-4">
            <p class="text-sm font-semibold mt-2 mb-1">Verlauf gesamt</p>
            <div class="mt-1">
                <div id="chart-3" style="height: 300px; width: 100%; text-align: center; color: #999; line-height: 300px; font-size: 14px;">Loading...</div>
                <script th:inline="javascript">
                    (function() {
                        var createChart = function() {
                            new Chartkick["LineChart"]("chart-3", /*[[${diagramData}]]*/ [],
                                {"curve": false, "legend": "bottom", "library": {"scales": {"y": {"reverse": true}}}});
                        };
                        if (typeof Chartkick !== "undefined") { createChart(); }
                        else { window.addEventListener("chartkick:load", createChart, true); }
                    })();
                </script>
            </div>
            <p class="text-sm font-semibold mt-2 mb-1">Punkte gesamt</p>
            <div class="mt-1">
                <div id="chart-4" style="height: 300px; width: 100%; text-align: center; color: #999; line-height: 300px; font-size: 14px;">Loading...</div>
                <script th:inline="javascript">
                    (function() {
                        var createChart = function() {
                            new Chartkick["ColumnChart"]("chart-4", /*[[${diagramScoreData}]]*/ [],
                                {"legend": false});
                        };
                        if (typeof Chartkick !== "undefined") { createChart(); }
                        else { window.addEventListener("chartkick:load", createChart, true); }
                    })();
                </script>
            </div>
        </div>

        <!-- Section 4: Complete history table -->
        <div class="mb-3 mt-4">
            <span class="text-sm font-semibold">Gesamtverlauf</span>
            <div class="mt-3 overflow-x-auto">
                <div class="grid grid-cols-12 bg-gray-800 text-white font-bold min-w-max">
                    <div class="col-span-2 py-2 px-1">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true" class="ri-icon" style="display:inline-block;"><path d="M152 24c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 40L64 64C28.7 64 0 92.7 0 128l0 16 0 48L0 448c0 35.3 28.7 64 64 64l320 0c35.3 0 64-28.7 64-64l0-256 0-48 0-16c0-35.3-28.7-64-64-64l-40 0 0-40c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 40L152 64l0-40zM48 192l80 0 0 56-80 0 0-56zm0 104l80 0 0 64-80 0 0-64zm128 0l96 0 0 64-96 0 0-64zm144 0l80 0 0 64-80 0 0-64zm80-48l-80 0 0-56 80 0 0 56zm0 160l0 40c0 8.8-7.2 16-16 16l-64 0 0-56 80 0zm-128 0l0 56-96 0 0-56 96 0zm-144 0l0 56-64 0c-8.8 0-16-7.2-16-16l0-40 80 0zM272 248l-96 0 0-56 96 0 0 56z"/></svg>
                    </div>
                    <div class="col-span-1 py-2 px-1">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true" class="ri-icon" style="display:inline-block;"><path d="M64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l320 0c35.3 0 64-28.7 64-64l0-320c0-35.3-28.7-64-64-64L64 32zm64 192c17.7 0 32 14.3 32 32l0 96c0 17.7-14.3 32-32 32s-32-14.3-32-32l0-96c0-17.7 14.3-32 32-32zm64-64c0-17.7 14.3-32 32-32s32 14.3 32 32l0 192c0 17.7-14.3 32-32 32s-32-14.3-32-32l0-192zM320 288c17.7 0 32 14.3 32 32l0 32c0 17.7-14.3 32-32 32s-32-14.3-32-32l0-32c0-17.7 14.3-32 32-32z"/></svg>
                    </div>
                    <div th:each="ag : ${ {'U11','U12','U13','U14','U15','U16','U17','U18','Aktive'} }"
                         class="col-span-1 py-2 px-1" th:text="${ag}"></div>
                </div>
                <div th:each="r, stat : ${completeRankings}"
                     th:class="${'grid grid-cols-12 border-b border-gray-200 min-w-max ' + (stat.odd ? 'striped' : '')}">
                    <div class="col-span-2 py-1 px-1" th:text="${r['date']}"></div>
                    <div class="col-span-1 py-1 px-1" th:text="${r['score']}"></div>
                    <div class="col-span-1 py-1 px-1" th:text="${r['U11'] ?: ''}"></div>
                    <div class="col-span-1 py-1 px-1" th:text="${r['U12'] ?: ''}"></div>
                    <div class="col-span-1 py-1 px-1" th:text="${r['U13'] ?: ''}"></div>
                    <div class="col-span-1 py-1 px-1" th:text="${r['U14'] ?: ''}"></div>
                    <div class="col-span-1 py-1 px-1" th:text="${r['U15'] ?: ''}"></div>
                    <div class="col-span-1 py-1 px-1" th:text="${r['U16'] ?: ''}"></div>
                    <div class="col-span-1 py-1 px-1" th:text="${r['U17'] ?: ''}"></div>
                    <div class="col-span-1 py-1 px-1" th:text="${r['U18'] ?: ''}"></div>
                    <div class="col-span-1 py-1 px-1" th:text="${r['Aktive'] ?: ''}"></div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>

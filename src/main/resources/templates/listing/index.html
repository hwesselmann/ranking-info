<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ranglisten | Ranking-Info</title>
    <meta name="description" content="Durchsuchbare und filterbare Version der Deutschen Tennis-Rangliste.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { brand: '#3e8ed0' } } } }</script>
    <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="w-full px-4 mx-auto">
<main>
    <h1 class="text-2xl font-bold text-left mb-3 mt-3">Ranglisten</h1>
    <form th:action="@{/listings}" method="get" class="mb-4">
        <div class="flex flex-wrap items-start gap-3">
            <div>
                <label for="quarter" class="block text-xs text-gray-500">Stichtag</label>
                <select id="quarter" name="quarter" class="border border-gray-300 rounded px-2 py-1">
                    <th:block th:each="entry : ${quarters}">
                        <optgroup th:label="${entry.key}">
                            <option th:each="opt : ${entry.value}"
                                    th:value="${opt.second}"
                                    th:text="${opt.first}"
                                    th:selected="${params != null and params['quarter'] == opt.second}"></option>
                        </optgroup>
                    </th:block>
                </select>
                <label for="year_end" class="flex items-center gap-1 text-xs text-gray-500 mt-1">
                    <input type="checkbox" id="year_end" name="year_end" value="1"
                           th:checked="${params != null and params['year_end'] == '1'}"> Abschlussrangliste
                </label>
            </div>
            <div>
                <label for="gender" class="block text-xs text-gray-500">Geschlecht</label>
                <select id="gender" name="gender" class="border border-gray-300 rounded px-2 py-1">
                    <option th:each="g : ${ {'Herren','Damen','Junioren','Juniorinnen'} }" th:value="${g}" th:text="${g}"
                            th:selected="${params != null and params['gender'] == g}"></option>
                </select>
            </div>
            <div>
                <label for="age_group" class="block text-xs text-gray-500">Altersklasse</label>
                <select id="age_group" name="age_group" class="border border-gray-300 rounded px-2 py-1">
                    <option value=""></option>
                    <option th:each="ag : ${ {'U11','U12','U13','U14','U15','U16','U17','U18'} }" th:value="${ag}"
                            th:text="${ag}" th:selected="${params != null and params['age_group'] == ag}"></option>
                </select>
            </div>
            <div>
                <label for="age_group_options" class="block text-xs text-gray-500">Extras</label>
                <select id="age_group_options" name="age_group_options" class="border border-gray-300 rounded px-2 py-1">
                    <option value=""></option>
                    <option value="only_yob" th:selected="${params != null and params['age_group_options'] == 'only_yob'}">nur Geburtsjahrgang</option>
                    <option value="include_younger" th:selected="${params != null and params['age_group_options'] == 'include_younger'}">auch Jüngere einbeziehen</option>
                </select>
            </div>
            <div>
                <label for="federation" class="block text-xs text-gray-500">Verband</label>
                <select id="federation" name="federation" class="border border-gray-300 rounded px-2 py-1">
                    <option value=""></option>
                    <option th:each="f : ${federations}" th:value="${f}" th:text="${f}"
                            th:selected="${params != null and params['federation'] == f}"></option>
                </select>
            </div>
            <div>
                <label for="club" class="block text-xs text-gray-500">Verein</label>
                <input type="search" id="club" name="club" class="border border-gray-300 rounded px-2 py-1"
                       size="10" placeholder="Verein" th:value="${params != null ? params['club'] : ''}">
            </div>
            <div>
                <div class="block text-xs invisible">.</div>
                <button type="submit" name="commit" value="1"
                        class="bg-brand text-white px-3 py-1 text-sm rounded hover:opacity-90 cursor-pointer">
                    Liste abrufen
                </button>
            </div>
        </div>
    </form>

    <div th:if="${rankings != null and !#lists.isEmpty(rankings)}" class="overflow-x-auto mb-2">
        <table class="w-full">
            <thead>
            <tr class="bg-gray-100">
                <th scope="col" class="py-2 px-2 hidden md:table-cell">#</th>
                <th scope="col" class="py-2 px-2">Rang</th>
                <th scope="col" class="py-2 px-2">Nachname, Vorname</th>
                <th scope="col" class="py-2 px-2">DTB-ID</th>
                <th scope="col" class="py-2 px-2 hidden md:table-cell">Nationalität</th>
                <th scope="col" class="py-2 px-2 hidden md:table-cell">Verein</th>
                <th scope="col" class="py-2 px-2 hidden md:table-cell">Verband</th>
                <th scope="col" class="py-2 px-2">Punkte</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r, stat : ${rankings}" class="border-b border-gray-200 even:bg-gray-50">
                <td class="text-center py-1 px-2 hidden md:table-cell" th:text="${stat.index + 1}"></td>
                <td class="py-1 px-2">
                    <span th:text="${r.rankingPosition}"></span>
                    <th:block th:if="${previousPositions != null}">
                        <th:block th:with="prev=${previousPositions.get(r.dtbId)}">
                            <span th:if="${prev != null and prev > r.rankingPosition}" class="ri-icon-green" style="margin-left: 5px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true" class="ri-icon" style="display:inline-block;"><path d="M182.6 137.4c-12.5-12.5-32.8-12.5-45.3 0l-128 128c-9.2 9.2-11.9 22.9-6.9 34.9s16.6 19.8 29.6 19.8l256 0c12.9 0 24.6-7.8 29.6-19.8s2.2-25.7-6.9-34.9l-128-128z" /></svg></span>
                            <span th:if="${prev != null and prev < r.rankingPosition}" class="ri-icon-red" style="margin-left: 5px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true" class="ri-icon" style="display:inline-block;"><path d="M137.4 374.6c12.5 12.5 32.8 12.5 45.3 0l128-128c9.2-9.2 11.9-22.9 6.9-34.9s-16.6-19.8-29.6-19.8L32 192c-12.9 0-24.6 7.8-29.6 19.8s-2.2 25.7 6.9 34.9l128 128z" /></svg></span>
                        </th:block>
                    </th:block>
                </td>
                <td class="py-1 px-2" th:text="${r.lastname + ', ' + r.firstname}"></td>
                <td class="py-1 px-2">
                    <a th:href="@{/players/{id}(id=${r.dtbId})}" class="text-brand" th:text="${r.dtbId}"></a>
                </td>
                <td class="text-center py-1 px-2 hidden md:table-cell">
                    <img th:src="@{/images/{nat}.svg(nat=${r.nationality.toLowerCase()})}"
                         width="30" th:alt="${r.nationality}">
                </td>
                <td class="py-1 px-2 hidden md:table-cell">
                    <a th:href="@{/clubs/{name}(name=${r.club})}" class="text-brand" th:text="${r.club}"></a>
                </td>
                <td class="text-center py-1 px-2 hidden md:table-cell" th:text="${r.federation}"></td>
                <td class="py-1 px-2" th:text="${r.score}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${rankings != null and #lists.isEmpty(rankings)}" class="mt-4 text-gray-600">
        Es wurden leider keine Daten für diese Suchkriterien gefunden.
    </div>
</main>
</div>
</body>
</html>

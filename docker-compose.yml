services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ranking_info
      DB_USER: ranking_info
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-changeme}
      IMPORT_FOLDER: /data/import
      IMPORT_SCHEDULE: ${IMPORT_SCHEDULE:-0 0 12 * * ?}
      DOMAIN: ${DOMAIN:-localhost}
      IMPRINT_NAME: ${IMPRINT_NAME:-}
      IMPRINT_STREET: ${IMPRINT_STREET:-}
      IMPRINT_ZIPCODE: ${IMPRINT_ZIPCODE:-}
      IMPRINT_CITY: ${IMPRINT_CITY:-}
      IMPRINT_PHONE: ${IMPRINT_PHONE:-}
      IMPRINT_MAIL: ${IMPRINT_MAIL:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-ranking-info}
    volumes:
      - import-data:/data/import
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ranking_info
      POSTGRES_USER: ranking_info
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranking_info"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    restart: unless-stopped

  newrelic-infra:
    image: newrelic/infrastructure-bundle:3.3.30
    privileged: true
    pid: host
    cap_add:
      - SYS_PTRACE
    environment:
      NRIA_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NRIA_DISPLAY_NAME: ${NEW_RELIC_HOST_DISPLAY_NAME:-ranking-info-host}
      NRIA_PASSTHROUGH_ENVIRONMENT: DB_PASSWORD
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - /:/host:ro,rslave
      - /var/run/docker.sock:/var/run/docker.sock
      - ./newrelic/postgresql-config.yml:/etc/newrelic-infra/integrations.d/postgresql-config.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 150m
          cpus: "0.25"
    restart: unless-stopped

volumes:
  postgres-data:
  import-data:
